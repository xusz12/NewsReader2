<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="1008" viewBox="0 0 1504 1008" color="#c96442" role="img" aria-labelledby="title desc"><title id="title">留白书签 · 几何骨架与负空间规范</title><desc id="desc">按实际路径标注主体宽高、圆角、负空间、底部切口、安全留白及尺寸分级。</desc><rect width="1504" height="1008" fill="#f5f4ed"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#141413}.muted{fill:#5e5d59}.dim{stroke:#5e5d59;stroke-width:1.5;fill:none}.axis{stroke:#c96442;stroke-width:1;stroke-dasharray:6 6}</style><text x="64" y="88" font-size="44">留白书签 / 几何与负空间</text><text x="64" y="136" font-size="24" class="muted">128 × 128 坐标系 · 基础单位 u = 4 · 标准版</text><defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#e1dfd5" stroke-width="0.7"/></pattern></defs><rect x="64" y="192" width="704" height="640" rx="8" fill="url(#grid)"/><g transform="translate(160 240) scale(4)"><rect x="16" y="4" width="96" height="120" fill="none" stroke="#c96442" stroke-width="0.4" stroke-dasharray="2 2"/><path fill-rule="evenodd" fill="currentColor" d="M32 12H96A8 8 0 0 1 104 20V116L64 96L24 116V20A8 8 0 0 1 32 12Z M44 84V36H56V44C62 36 69 32 78 32C81 32 84 32.5 88 34V48C84 46 81 45 77 45C66 45 60 51 60 62V84Z"/><path d="M64 -4V136M8 64H120" class="axis" vector-effect="non-scaling-stroke"/></g><path d="M256 220V198M576 220V198M256 204H576" class="dim"/><text x="416" y="188" text-anchor="middle" font-size="24">80 = 20u</text><path d="M600 288H632M600 704H632M624 288V704" class="dim"/><text x="648" y="488" font-size="24">104</text><text x="648" y="524" font-size="24">26u</text><path d="M336 536V560M400 536V560M336 548H400M336 548L288 580H112" class="dim"/><text x="112" y="620" font-size="24">16 = 4u</text><path d="M416 624H468M456 624V704M448 704H468" class="dim"/><text x="480" y="728" font-size="24">20 = 5u</text><path d="M256 320L224 272H120" class="dim"/><text x="96" y="256" font-size="24">R8</text><text x="96" y="792" font-size="24" class="muted">虚线框：四周至少 2u（8 单位）安全留白</text><text x="832" y="244" font-size="28">01  外轮廓</text><text x="832" y="284" font-size="24" class="muted">宽 80 · 高 104 · 顶部圆角 R8</text><text x="832" y="340" font-size="28">02  负形 r</text><text x="832" y="380" font-size="24" class="muted">竖腔 16 · 右侧实体边壁 16</text><text x="832" y="436" font-size="28">03  底部切口</text><text x="832" y="476" font-size="24" class="muted">深 20 · 左右对称 · 中点 (64, 96)</text><text x="832" y="532" font-size="28">04  安全留白</text><text x="832" y="572" font-size="24" class="muted">至少 8 · 从可见轮廓向外测量</text><text x="832" y="628" font-size="28">05  小尺寸版本</text><text x="832" y="668" font-size="24" class="muted">16–24px 使用加宽版；竖腔 24</text><text x="832" y="724" font-size="28">06  标准版本</text><text x="832" y="764" font-size="24" class="muted">32px 起保留标准轮廓与曲线</text><path d="M64 888H1440" class="dim"/><text x="64" y="944" font-size="24" class="muted">不得拉伸、描边或填满 r；反白时保留透明负空间。图形与字标间距不小于图形宽度的 1/4。</text></svg>
